name: Build

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make lint

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: make test-race

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Its own step, so a registry failure isn't read as a test timeout; uncached because the tag floats.
      - run: docker pull ghcr.io/hyperledger-labs/microfab:latest
      - run: make test-integration

  # Beside the jobs above, not instead of them: those build at the api version
  # go.mod requires, this at api's main, so metacensus/api#94 never goes red
  # on this repository's account (#34).
  api-main:
    name: Against api's main
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Checkout api's main
        uses: actions/checkout@v4
        with:
          repository: metacensus/api
          ref: main
          # Dot-prefixed, so ./... patterns skip it.
          path: .api
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Replace api with its main
        run: |
          go mod edit -replace "github.com/metacensus/api=$GITHUB_WORKSPACE/.api"
          echo "Built against metacensus/api@$(git -C .api rev-parse HEAD)." >> "$GITHUB_STEP_SUMMARY"
      # Its own step, so a registry failure isn't read as a test timeout; uncached because the tag floats.
      - run: docker pull ghcr.io/hyperledger-labs/microfab:latest
      # -mod=mod records go.sum entries for anything api's main requires.
      - run: make api-check
        env:
          GOWORK: "off"
          GOFLAGS: -mod=mod

  artifact:
    name: Images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: docker/setup-buildx-action@v3
      - name: Build the API image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: service
          load: true
          tags: metacensus/service-api-chain:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=service
          cache-to: type=gha,scope=service,mode=max
      - name: Build the chaincode image (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          target: chaincode
          load: true
          tags: metacensus/service-api-chain-chaincode:ci
          platforms: linux/amd64
          cache-from: type=gha,scope=chaincode
          cache-to: type=gha,scope=chaincode,mode=max
      - run: docker pull ghcr.io/hyperledger-labs/microfab:latest
      - run: make test-artifact SERVICE_IMAGE=metacensus/service-api-chain:ci CHAINCODE_IMAGE=metacensus/service-api-chain-chaincode:ci
