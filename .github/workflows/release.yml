name: Release

on:
  push:
    tags:
      # Must match scripts/version.sh's VERSION_REGEX.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/build.yml

  publish-image:
    name: Publish ${{ matrix.image }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: service-api-chain
            target: service
          - image: service-api-chain-chaincode
            target: chaincode
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        env:
          DOCKERHUB_OIDC_CONNECTIONID: 3f5a9a0e-8f39-4d18-8a22-168682a00521
        with:
          username: metacensus

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/metacensus/${{ matrix.image }}
          tags: |
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
