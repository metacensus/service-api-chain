name: Main

# Weekly too, with no change to blame: a base image, a toolchain patch or a
# Microfab release can break what passed last week.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 3 * * 0"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
