name: Pull request

on:
  pull_request:
    branches: [main]
  # The merge queue (#35) reruns everything against main as it stands at merge time.
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml

  pull-request:
    name: Pull request success
    needs: build
    # A skipped required check reads as passing, so this runs and fails instead.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: needs.build.result != 'success'
        run: exit 1
