name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            integration/go.sum

      - run: make check

  integration:
    name: Integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      IMAGE_TAG: ci
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            integration/go.sum

      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: metacensus/service-api-chain:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=gha,scope=service
          cache-to: type=gha,scope=service,mode=max

      - name: Build the chaincode image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.chaincode
          load: true
          tags: metacensus/service-api-chain-chaincode:${{ env.IMAGE_TAG }}
          platforms: linux/amd64
          cache-from: type=gha,scope=chaincode
          cache-to: type=gha,scope=chaincode,mode=max

      # Its own step, so a registry failure isn't read as a test timeout; uncached because the tag floats.
      - name: Pull Microfab
        run: docker pull ghcr.io/hyperledger-labs/microfab:latest

      - name: Exercise the images on Microfab
        run: make test-integration SKIP_DOCKER_BUILD=1

  ci:
    name: CI
    needs: [check, integration]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
